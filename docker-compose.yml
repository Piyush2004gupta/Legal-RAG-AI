services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: legaldesk-backend:latest
    container_name: legaldesk_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - STORAGE_PATH=/app/storage
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: legaldesk-frontend:latest
    container_name: legaldesk_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
